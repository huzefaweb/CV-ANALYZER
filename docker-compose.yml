name: cv-analyzer

# V1 profile (AR-2, AR-3, AD-1): Next.js web, FastAPI gateway, Python worker,
# and PostgreSQL only — no Redis, Celery, event bus, or other infrastructure.

services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images store data under a major-version subdirectory
      # of /var/lib/postgresql itself, not /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  gateway:
    build:
      context: ./apps/gateway
    working_dir: /app
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn src.adapters.api:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Identity-adapter selection (AD-21): presence of all three selects
      # Auth0; their absence (the V1 default) selects the local adapter.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/gateway:/app
      # Anonymous volume shadows the host .venv so the container's Linux
      # venv (baked at build time) is never clobbered by the bind mount.
      - /app/.venv
      - restricted-source-volume:/restricted-source
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./apps/worker
    working_dir: /app
    command: ["uv", "run", "python", "-m", "src.main"]
    environment:
      # ponytail: same role as gateway until a table-owning story needs the
      # worker's own least-privilege role (AD-15/AR-43) to grant against.
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Analysis-provider adapter selection (AD-22): presence of all four
      # AZURE_OPENAI_* vars below selects Azure OpenAI; their absence (the
      # V1 default) selects the local Ollama adapter at OLLAMA_HOST.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
    volumes:
      - ./apps/worker:/app
      - /app/.venv
      - restricted-source-volume:/restricted-source
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest@sha256:a61a8fd395dbb931cc8cb1b5da7a2510746575c87113fdc45b647ee59ef7f808
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./apps/web
    working_dir: /app
    # Production build (Story 8.1): `next dev`'s Turbopack server unconditionally
    # overwrites Cache-Control with `no-cache, must-revalidate` (deferred-work.md,
    # Story 2.4 entry) and 404s the nested retry route under Turbopack dev mode
    # (deferred-work.md, Story 5.4 entry). `next start` avoids both.
    command: sh -c "npm run build && npm run start"
    environment:
      # Server-side only (no NEXT_PUBLIC_ prefix) — browser JS never talks to
      # the gateway directly (AD-2/AD-21).
      GATEWAY_URL: http://gateway:8000
      # Identity-adapter selection (AD-21), mirrored from the gateway's own
      # check so the Login/Register surface can decide which form to render.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      # Keep Next's cache and dev lock off the host bind mount so a host-side
      # Next process and this container can run without sharing .next/dev/lock.
      - /app/.next
    depends_on:
      - gateway

volumes:
  postgres-data:
  # Restricted source-byte volume (AD-15): mounted only into gateway and
  # worker, never into web.
  restricted-source-volume:
  # Pulled Ollama models persist here so `ollama pull` survives container
  # restarts. One-time pre-demo step (AD-22): `docker compose exec ollama
  # ollama pull qwen2.5:0.5b-instruct`.
  ollama-data:
