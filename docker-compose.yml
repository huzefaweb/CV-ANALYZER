name: cv-analyzer

# V1 profile (AR-2, AR-3, AD-1): Next.js web, FastAPI gateway, Python worker,
# and PostgreSQL only — no Redis, Celery, event bus, or other infrastructure.

services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images store data under a major-version subdirectory
      # of /var/lib/postgresql itself, not /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  gateway:
    build:
      context: ./apps/gateway
    working_dir: /app
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn src.adapters.api:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/gateway:/app
      # Anonymous volume shadows the host .venv so the container's Linux
      # venv (baked at build time) is never clobbered by the bind mount.
      - /app/.venv
      - restricted-source-volume:/restricted-source
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./apps/worker
    working_dir: /app
    command: ["uv", "run", "python", "-m", "src.main"]
    environment:
      # ponytail: same role as gateway until a table-owning story needs the
      # worker's own least-privilege role (AD-15/AR-43) to grant against.
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./apps/worker:/app
      - /app/.venv
      - restricted-source-volume:/restricted-source
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    working_dir: /app
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - gateway

volumes:
  postgres-data:
  # Restricted source-byte volume (AD-15): mounted only into gateway and
  # worker, never into web.
  restricted-source-volume:
